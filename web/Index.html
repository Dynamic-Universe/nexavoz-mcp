<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexavoz</title>
<meta name="description" content="Nexavoz, revista digital">
<style>
  :root { --bg:#faf8f5; --fg:#1d1b19; --muted:#6b655e; --card:#ffffff; --line:#e6e0d8; --accent:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161412; --fg:#f1ede7; --muted:#a39b91; --card:#1f1c19; --line:#332e29; --accent:#ff6b5e; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.65 Georgia, "Times New Roman", serif; }
  header { padding:28px 20px 12px; max-width:880px; margin:0 auto; }
  header a { color:var(--fg); text-decoration:none; }
  h1.logo { margin:0; font-size:2rem; letter-spacing:.02em; }
  h1.logo span { color:var(--accent); }
  main { max-width:880px; margin:0 auto; padding:8px 20px 60px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:18px; margin-top:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; cursor:pointer; }
  .card img, .card .ph { width:100%; aspect-ratio:3/4; object-fit:cover; display:block; background:var(--line); }
  .card .info { padding:12px 14px 16px; }
  .card .num { color:var(--accent); font:600 .8rem system-ui, sans-serif; text-transform:uppercase; letter-spacing:.08em; }
  .card h2 { margin:4px 0 0; font-size:1.1rem; line-height:1.3; }
  .muted { color:var(--muted); font:.9rem system-ui, sans-serif; }
  .btn { display:inline-block; margin:10px 10px 0 0; padding:10px 16px; border-radius:8px; background:var(--accent); color:#fff;
         text-decoration:none; font:600 .95rem system-ui, sans-serif; }
  .btn.alt { background:transparent; color:var(--fg); border:1px solid var(--line); }
  article { border-top:1px solid var(--line); padding:28px 0; }
  article h2 { margin:.2em 0 0; font-size:1.7rem; line-height:1.25; }
  article .sub { color:var(--muted); font-size:1.1rem; margin:.3em 0 0; }
  article .meta { font:.85rem system-ui, sans-serif; color:var(--muted); margin:10px 0 18px; }
  article img { max-width:100%; border-radius:8px; margin:12px 0 4px; }
  figcaption { font:.8rem system-ui, sans-serif; color:var(--muted); }
  .tag { display:inline-block; margin-right:6px; font:.75rem system-ui, sans-serif; color:var(--muted); border:1px solid var(--line); border-radius:99px; padding:2px 10px; }
  .back { color:var(--accent); cursor:pointer; font:600 .95rem system-ui, sans-serif; }
  .sub { border-top:1px solid var(--line); margin-top:40px; padding-top:24px; font-family:system-ui, sans-serif; }
  .sub h3 { margin:0 0 4px; font-family:Georgia, serif; font-size:1.2rem; }
  .sub .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .sub input[type=email] { flex:1 1 220px; padding:11px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); font-size:1rem; }
  .sub button { padding:11px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; font-size:1rem; cursor:pointer; }
  .sub .hp { position:absolute; left:-9999px; }
  .sub small { display:block; margin-top:10px; color:var(--muted); }
</style>
</head>
<body>
<header><a href="#"><h1 class="logo">Nexa<span>voz</span></h1></a></header>
<main id="app"><p class="muted">Cargando…</p></main>
<main class="sub-wrap" style="padding-top:0">
  <div class="sub">
    <h3>Recibe cada número en tu correo</h3>
    <div class="muted">Te avisamos cuando se publique uno nuevo.</div>
    <div class="row">
      <input type="email" id="sub-email" placeholder="tu@correo.com" autocomplete="email">
      <input type="text" id="sub-web" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button id="sub-btn">Suscribirme</button>
    </div>
    <small id="sub-msg">Te enviaremos un correo para confirmar. Puedes darte de baja cuando quieras.</small>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  // 1) Pega aquí tus datos de Supabase (Settings → API). La clave "anon" es pública y segura gracias a las políticas de schema-publico.sql.
  const SUPABASE_URL = "PEGA_AQUI_TU_PROJECT_URL";
  const SUPABASE_ANON_KEY = "PEGA_AQUI_TU_ANON_KEY";
  // 2) URL de tu servicio MCP en Render (sin / al final), p. ej. https://nexavoz-mcp.onrender.com
  const API_URL = "PEGA_AQUI_LA_URL_DEL_MCP";

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const app = document.getElementById("app");

  const safeUrl = (u) => (/^https?:\/\//i.test(u || "") ? u : "#");
  const el = (tag, props = {}, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (v == null) continue;
      if (k === "class") e.className = v;
      else if (k === "href" || k === "src") e.setAttribute(k, safeUrl(v));
      else if (k === "onclick") e.onclick = v;
      else e.setAttribute(k, v);
    }
    kids.flat().forEach((c) => c != null && e.append(c));
    return e;
  };
  const setMeta = (t) => document.querySelector('meta[name="description"]')?.setAttribute("content", String(t).slice(0, 160));
  const fmtDate = (d) => d ? new Date(d).toLocaleDateString("es-ES", { year: "numeric", month: "long", day: "numeric" }) : "";
  const show = (...nodes) => { app.replaceChildren(...nodes); window.scrollTo(0, 0); };
  const message = (t) => show(el("p", { class: "muted" }, t));

  async function renderList() {
    const { data, error } = await db.from("issues").select("*").eq("status", "publicado").order("number", { ascending: false });
    if (error) return message("No se pudieron cargar los números.");
    if (!data.length) return message("Todavía no hay números publicados.");
    const cards = data.map((i) =>
      el("div", { class: "card", onclick: () => (location.hash = "n" + i.number) },
        i.cover_url ? el("img", { src: i.cover_url, alt: "Portada del número " + i.number, loading: "lazy" }) : el("div", { class: "ph" }),
        el("div", { class: "info" },
          el("div", { class: "num" }, "Nº " + i.number),
          el("h2", {}, i.title),
          el("div", { class: "muted" }, fmtDate(i.issue_date)))));
    show(el("h2", {}, "Números"), el("div", { class: "grid" }, cards));
  }

  async function renderIssue(number) {
    const { data: issue, error } = await db.from("issues").select("*").eq("number", number).eq("status", "publicado").single();
    if (error || !issue) return message("Este número no existe o todavía no está publicado.");
    const { data: arts } = await db.from("articles")
      .select("id,title,subtitle,body,tags,publish_at,sections(name),authors(name)")
      .eq("issue_id", issue.id).order("created_at");
    const { data: assets } = await db.from("assets").select("*").eq("issue_id", issue.id);
    const all = assets || [];

    const head = [
      el("span", { class: "back", onclick: () => (location.hash = "") }, "← Todos los números"),
      el("h2", { style: "font-size:2rem;margin:.4em 0 0" }, `Nº ${issue.number} · ${issue.title}`),
      el("div", { class: "muted" }, fmtDate(issue.issue_date)),
      issue.summary ? el("p", {}, issue.summary) : null,
      issue.pdf_url ? el("a", { class: "btn", href: issue.pdf_url, target: "_blank", rel: "noopener" }, "Descargar PDF") : null,
      ...all.filter((a) => (a.kind === "video" || a.kind === "audio") && !a.article_id)
        .map((a) => el("a", { class: "btn alt", href: a.url, target: "_blank", rel: "noopener" }, a.kind === "video" ? "Ver vídeo" : "Escuchar audio")),
    ];

    const articles = (arts || []).map((a) => {
      const mine = all.filter((x) => x.article_id === a.id);
      const paragraphs = (a.body || "").split(/\n{2,}/).map((p) => el("p", {}, p.trim())).filter((p) => p.textContent);
      return el("article", {},
        a.sections?.name ? el("div", { class: "muted" }, a.sections.name.toUpperCase()) : null,
        el("h2", {}, a.title),
        a.subtitle ? el("p", { class: "sub" }, a.subtitle) : null,
        el("div", { class: "meta" }, [a.authors?.name ? "Por " + a.authors.name : "", fmtDate(a.publish_at)].filter(Boolean).join(" · ")),
        ...mine.filter((x) => x.kind === "imagen").map((x) =>
          el("figure", { style: "margin:0" }, el("img", { src: x.url, alt: x.caption || a.title, loading: "lazy" }),
            (x.caption || x.credit) ? el("figcaption", {}, [x.caption, x.credit && "Foto: " + x.credit].filter(Boolean).join(" · ")) : null)),
        ...paragraphs,
        ...mine.filter((x) => x.kind === "video" || x.kind === "audio").map((x) =>
          el("a", { class: "btn alt", href: x.url, target: "_blank", rel: "noopener" }, x.kind === "video" ? "Ver vídeo" : "Escuchar audio")),
        (a.tags || []).length ? el("div", { style: "margin-top:14px" }, a.tags.map((t) => el("span", { class: "tag" }, t))) : null);
    });

    document.title = `Nexavoz · Nº ${issue.number}`;
    setMeta(issue.seo_description || issue.summary || `Nexavoz, número ${issue.number}`);
    show(...head, ...articles);
  }

  function route() {
    const m = location.hash.match(/^#n(\d+)$/);
    document.title = "Nexavoz";
    setMeta("Nexavoz, revista digital");
    m ? renderIssue(parseInt(m[1], 10)) : renderList();
  }
  document.getElementById("sub-btn").onclick = async () => {
    const msg = document.getElementById("sub-msg");
    const email = document.getElementById("sub-email").value.trim();
    if (!email) { msg.textContent = "Escribe tu correo."; return; }
    msg.textContent = "Enviando…";
    try {
      const r = await fetch(API_URL + "/api/subscribe", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ email, website: document.getElementById("sub-web").value }),
      });
      const j = await r.json();
      msg.textContent = j.ok ? "¡Casi listo! Revisa tu correo y confirma la suscripción." : (j.error || "No se pudo suscribir.");
      if (j.ok) document.getElementById("sub-email").value = "";
    } catch (e) { msg.textContent = "No se pudo conectar. Inténtalo de nuevo en un minuto."; }
  };

  window.addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
